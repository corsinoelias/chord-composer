<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: hsl(262 83% 52%); text-decoration: none; }
    a:hover { color: hsl(262 83% 42%); }
    .rt {
      --bg: hsl(220 20% 97%); --fg: hsl(220 20% 10%); --card: hsl(0 0% 100%);
      --primary: hsl(262 83% 52%); --primary-fg: hsl(0 0% 100%);
      --secondary: hsl(220 14% 92%); --muted-fg: hsl(220 10% 42%);
      --border: hsl(220 13% 87%);
      --tint: hsl(262 83% 52% / 0.06); --tint2: hsl(262 83% 52% / 0.12);
    }
    .mono { font-family: 'Space Mono', monospace; }
    .chd { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: hsl(262 83% 52% / 0.75); }
    .lyr { font-size: 14.5px; line-height: 1.5; white-space: pre; color: var(--muted-fg); }
    .sechd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted-fg); }
    .icobtn { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--muted-fg); }
  </style>
</helmet>

<div class="rt" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif;">

  <!-- Nothing pinned. Nothing floating. The head scrolls away like any heading, and this is
       the whole screen: lyrics and chords. -->
  <div style="padding: 18px 16px 0;">

    <div style="display: flex; align-items: center; gap: 13px;">
      <div style="width: 58px; height: 58px; border-radius: 12px; border: 1px solid var(--border); background: linear-gradient(135deg, hsl(200 60% 25%), hsl(262 70% 55%)); flex-shrink: 0;"></div>
      <div style="min-width: 0;">
        <div style="font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -0.022em;">Center</div>
        <div style="font-size: 13px; color: var(--muted-fg); margin-top: 2px;">Bethel Music</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; margin-top: 15px;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 999px; background: var(--primary); color: var(--primary-fg); font-size: 14.5px; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        Play chords
      </div>
      <div style="width: 46px; height: 46px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--muted-fg);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="9" cy="8" r="2.5" fill="currentColor"/><circle cx="15" cy="16" r="2.5" fill="currentColor"/></svg>
      </div>
    </div>

    <div style="display: flex; gap: 6px; margin-top: 12px;">
      <span style="padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 12px; font-weight: 500;">Key of A</span>
      <span style="padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 12px; font-weight: 500;">66 BPM</span>
      <span style="padding: 4px 10px; border-radius: 999px; border: 1px solid hsl(43 96% 40% / 0.3); background: hsl(43 96% 56% / 0.12); font-size: 12px; font-weight: 500; color: hsl(38 92% 33%);">Intermediate</span>
    </div>

    <!-- chart: no cards, no boxes — a rule per section, so the lyrics get the whole width -->
    <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 5px;">

      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="sechd">Intro</span>
        <div style="flex-grow: 1; height: 1px; background: var(--border);"></div>
        <div class="icobtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></div>
        <div class="icobtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px 18px; padding-bottom: 16px;">
        <span class="chd">Aadd9</span><span class="chd">Amaj7</span><span class="chd">Dmaj7</span><span class="chd">F&#35;min7</span><span class="chd">Dmaj7</span>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="sechd">Verse 1</span>
        <span style="font-size: 9.5px; font-weight: 700; color: var(--muted-fg); background: var(--secondary); border-radius: 999px; padding: 1px 6px;">&#215;2</span>
        <div style="flex-grow: 1; height: 1px; background: var(--border);"></div>
        <div class="icobtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></div>
        <div class="icobtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 11px; padding-bottom: 18px;">
        <div><div class="chd">A</div><div class="lyr">Maybe we've made this</div><div class="lyr">complicated</div></div>
        <div><div class="chd">Dmaj7</div><div class="lyr">More than it was ever</div><div class="lyr">meant to be</div></div>
        <div><div class="chd">F&#35;m</div><div class="lyr">Hasn't it always been</div><div class="lyr">about the same thing</div></div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="sechd">Chorus 1</span>
        <span style="font-size: 9.5px; font-weight: 700; color: var(--muted-fg); background: var(--secondary); border-radius: 999px; padding: 1px 6px;">&#215;2</span>
        <div style="flex-grow: 1; height: 1px; background: var(--border);"></div>
        <div class="icobtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></div>
        <div class="icobtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></div>
      </div>
      <div style="display: flex; align-items: flex-end; flex-wrap: wrap;">
        <div><div class="chd">D</div><div class="lyr">You, be the </div></div>
        <div><div class="chd">F&#35;m</div><div class="lyr">center of </div></div>
        <div><div class="chd">A</div><div class="lyr">it all</div></div>
      </div>

    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
