<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: hsl(262 83% 65%); text-decoration: none; }
    a:hover { color: hsl(262 83% 75%); }
    .st {
      --bg: hsl(224 24% 10%);
      --fg: hsl(220 14% 96%);
      --card: hsl(224 20% 14%);
      --primary: hsl(262 83% 65%);
      --primary-fg: hsl(0 0% 100%);
      --secondary: hsl(224 18% 20%);
      --muted-fg: hsl(220 10% 55%);
      --border: hsl(224 15% 22%);
      --destructive: hsl(0 72% 55%);
      --tint: hsl(262 83% 65% / 0.10);
      --tint-strong: hsl(262 83% 65% / 0.20);
    }
  </style>
</helmet>

<div class="st" style="width: 1280px; height: 860px; position: relative; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; font-size: 14px;">

  <!-- ambient stage glow -->
  <div style="position: absolute; top: -160px; left: 50%; transform: translateX(-50%); width: 900px; height: 420px; border-radius: 999px; background: radial-gradient(ellipse at center, hsl(262 83% 65% / 0.16), transparent 68%); pointer-events: none;"></div>

  <!-- top strip -->
  <div style="position: relative; display: flex; align-items: center; gap: 16px; padding: 16px 28px;">
    <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--primary);">Practice mode</span>
    <span style="width: 1px; height: 14px; background: var(--border);"></span>
    <span style="font-size: 13px; font-weight: 600;">Holy Forever</span>
    <span style="font-size: 13px; color: var(--muted-fg);">Chris Tomlin</span>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 12px; font-weight: 600; color: var(--muted-fg);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      Exit practice
    </div>
  </div>

  <!-- stage: chart left, console right -->
  <div style="position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; padding: 8px 28px 0;">

    <!-- ─ chart, teleprompter scale ─ -->
    <div style="display: flex; flex-direction: column; gap: 26px; padding-left: 24px;">

      <!-- past line, faded -->
      <div style="opacity: 0.32;">
        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted-fg); margin-bottom: 8px;">Pre-chorus</div>
        <div style="display: flex; align-items: flex-end; flex-wrap: wrap;">
          <div style="display: flex; flex-direction: column;"><span style="font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--primary);">Am</span><span style="font-size: 26px; line-height: 1.35; white-space: pre;">Your name stands above them </span></div>
          <div style="display: flex; flex-direction: column;"><span style="font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--primary);">Dm</span><span style="font-size: 26px; line-height: 1.35; white-space: pre;">all</span></div>
        </div>
      </div>

      <!-- current section marker -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--primary);">Chorus</span>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary); background: var(--tint-strong); border: 1px solid hsl(262 83% 65% / 0.3); border-radius: 999px; padding: 3px 9px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
          Loop 3 / ∞
        </span>
        <div style="flex-grow: 1; height: 1px; background: var(--border);"></div>
      </div>

      <!-- ACTIVE line, largest -->
      <div style="border-left: 3px solid var(--primary); padding-left: 22px; margin-left: -25px;">
        <div style="display: flex; align-items: flex-end; flex-wrap: wrap;">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-family: 'Space Mono', monospace; font-size: 19px; font-weight: 700; color: var(--primary);">F</span>
            <span style="font-size: 44px; font-weight: 500; line-height: 1.2; letter-spacing: -0.015em; white-space: pre;">Holy for</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-family: 'Space Mono', monospace; font-size: 19px; font-weight: 700; color: var(--primary-fg); background: var(--primary); border-radius: 5px; padding: 1px 7px;">C</span>
            <span style="font-size: 44px; font-weight: 500; line-height: 1.2; letter-spacing: -0.015em; white-space: pre;">ever</span>
          </div>
        </div>
        <!-- beat dots -->
        <div style="display: flex; gap: 7px; margin-top: 14px;">
          <span style="width: 9px; height: 9px; border-radius: 999px; background: var(--primary);"></span>
          <span style="width: 9px; height: 9px; border-radius: 999px; background: var(--primary);"></span>
          <span style="width: 9px; height: 9px; border-radius: 999px; background: hsl(262 83% 65% / 0.25);"></span>
          <span style="width: 9px; height: 9px; border-radius: 999px; background: hsl(262 83% 65% / 0.25);"></span>
        </div>
      </div>

      <!-- next lines -->
      <div style="opacity: 0.55;">
        <div style="display: flex; align-items: flex-end; flex-wrap: wrap;">
          <div style="display: flex; flex-direction: column;"><span style="font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--primary);">Am</span><span style="font-size: 30px; line-height: 1.3; white-space: pre;">And all I say is </span></div>
          <div style="display: flex; flex-direction: column;"><span style="font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--primary);">G</span><span style="font-size: 30px; line-height: 1.3; white-space: pre;">holy</span></div>
        </div>
      </div>

      <div style="opacity: 0.28;">
        <div style="display: flex; align-items: flex-end; flex-wrap: wrap;">
          <div style="display: flex; flex-direction: column;"><span style="font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--primary);">F</span><span style="font-size: 26px; line-height: 1.3; white-space: pre;">Holy for</span></div>
          <div style="display: flex; flex-direction: column;"><span style="font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--primary);">C</span><span style="font-size: 26px; line-height: 1.3; white-space: pre;">ever</span></div>
        </div>
      </div>

    </div>

    <!-- ─ console rail ─ -->
    <div style="display: flex; flex-direction: column; gap: 16px;">

      <!-- now playing chord -->
      <div style="border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
        <span style="font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted-fg);">Now playing</span>
        <span style="font-family: 'Space Mono', monospace; font-size: 34px; font-weight: 700; line-height: 1; color: var(--primary);">C</span>
        <svg width="176" height="56" viewBox="0 0 188 62">
          <g stroke="var(--border)" stroke-width="1">
            <rect x="0" y="0" width="26" height="62" fill="var(--primary)" rx="2"/>
            <rect x="26" y="0" width="26" height="62" fill="hsl(220 14% 96%)" rx="2"/>
            <rect x="52" y="0" width="26" height="62" fill="var(--primary)" rx="2"/>
            <rect x="78" y="0" width="26" height="62" fill="hsl(220 14% 96%)" rx="2"/>
            <rect x="104" y="0" width="26" height="62" fill="var(--primary)" rx="2"/>
            <rect x="130" y="0" width="26" height="62" fill="hsl(220 14% 96%)" rx="2"/>
            <rect x="156" y="0" width="26" height="62" fill="hsl(220 14% 96%)" rx="2"/>
          </g>
          <g fill="hsl(224 24% 10%)">
            <rect x="18" y="0" width="16" height="38" rx="2"/>
            <rect x="44" y="0" width="16" height="38" rx="2"/>
            <rect x="96" y="0" width="16" height="38" rx="2"/>
            <rect x="122" y="0" width="16" height="38" rx="2"/>
            <rect x="148" y="0" width="16" height="38" rx="2"/>
          </g>
        </svg>
      </div>

      <!-- sections -->
      <div style="border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted-fg); margin-bottom: 2px;">Sections</span>
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 9px; background: {{s.bg}}; border: 1px solid {{s.bd}};">
            <span style="font-size: 13px; font-weight: {{s.weight}}; color: {{s.fg}};">{{s.name}}</span>
            <div style="flex-grow: 1;"></div>
            <div style="width: 22px; height: 22px; border-radius: 999px; background: {{s.loopBg}}; color: {{s.loopFg}}; display: flex; align-items: center; justify-content: center;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            </div>
          </div>
        </sc-for>
      </div>

      <!-- mixer -->
      <div style="border: 1px solid var(--border); border-radius: 14px; background: var(--card); padding: 12px 14px 14px;">
        <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted-fg);">Mixer</span>
        <div style="display: flex; justify-content: space-between; gap: 4px; margin-top: 12px;">
          <sc-for list="{{channels}}" as="ch" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 46px;">
              <span style="font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted-fg);">{{ch.label}}</span>
              <div style="position: relative; width: 4px; height: 92px; border-radius: 999px; background: var(--secondary);">
                <div style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 999px; background: var(--primary); height: {{ch.level}};"></div>
                <div style="position: absolute; left: 50%; transform: translate(-50%, 50%); bottom: {{ch.level}}; width: 20px; height: 20px; border-radius: 999px; background: var(--secondary); border: 1px solid var(--border);"></div>
              </div>
              <div style="width: 22px; height: 22px; border-radius: 999px; border: 1px solid {{ch.muteBorder}}; background: {{ch.muteBg}}; color: {{ch.muteFg}}; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">M</div>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </div>

  <!-- ─ bottom transport ─ -->
  <div style="position: absolute; left: 28px; right: 28px; bottom: 20px; display: flex; align-items: center; gap: 20px; padding: 12px 20px; border-radius: 18px; border: 1px solid var(--border); background: hsl(224 20% 14% / 0.92); backdrop-filter: blur(8px);">

    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted-fg);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="19 20 9 12 19 4 19 20"/><rect x="4" y="4" width="2.5" height="16" rx="1"/></svg>
      </div>
      <div style="width: 46px; height: 46px; border-radius: 999px; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted-fg);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 4 15 12 5 20 5 4"/><rect x="17.5" y="4" width="2.5" height="16" rx="1"/></svg>
      </div>
      <div style="width: 34px; height: 34px; border-radius: 999px; background: var(--tint-strong); color: var(--primary); display: flex; align-items: center; justify-content: center; margin-left: 4px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      </div>
    </div>

    <!-- timeline -->
    <div style="flex-grow: 1;">
      <div style="position: relative; height: 14px;">
        <span style="position: absolute; left: 0%; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-fg);">Intro</span>
        <span style="position: absolute; left: 12%; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-fg);">Verse 1</span>
        <span style="position: absolute; left: 36%; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-fg);">Pre-chorus</span>
        <span style="position: absolute; left: 58%; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary);">Chorus</span>
        <span style="position: absolute; left: 86%; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-fg);">Bridge</span>
      </div>
      <div style="position: relative; height: 4px; border-radius: 999px; background: var(--secondary); margin-top: 4px;">
        <div style="position: absolute; left: 58%; right: 14%; top: -2px; bottom: -2px; border-radius: 999px; background: var(--tint-strong); border: 1px solid hsl(262 83% 65% / 0.4);"></div>
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 68%; border-radius: 999px; background: var(--primary);"></div>
        <div style="position: absolute; left: 68%; top: 50%; transform: translate(-50%, -50%); width: 9px; height: 9px; border-radius: 999px; background: var(--primary); box-shadow: 0 0 0 4px hsl(262 83% 65% / 0.2);"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 14px; border-radius: 10px; background: var(--secondary);">
        <span style="font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-fg);">Speed</span>
        <span style="font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums;">90%</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 14px; border-radius: 10px; background: var(--secondary);">
        <span style="font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted-fg);">Key</span>
        <span style="font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums;">C</span>
      </div>
      <div style="width: 38px; height: 38px; border-radius: 10px; background: var(--tint-strong); color: var(--primary); display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 5 21h14L12 3Z"/><path d="M6.5 16h11"/><path d="M12 16 17 6"/></svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const idle = { bg: 'transparent', bd: 'transparent', fg: 'var(--muted-fg)', weight: '600', loopBg: 'var(--secondary)', loopFg: 'var(--muted-fg)' };
    return {
      sections: [
        { name: 'Intro', ...idle },
        { name: 'Verse 1', ...idle },
        { name: 'Pre-chorus', ...idle },
        { name: 'Chorus', bg: 'var(--tint-strong)', bd: 'hsl(262 83% 65% / 0.35)', fg: 'var(--primary)', weight: '700', loopBg: 'var(--primary)', loopFg: 'var(--primary-fg)' },
        { name: 'Bridge', ...idle },
      ],
      channels: [
        { label: 'Bass',  level: '62%', muteBorder: 'var(--border)', muteBg: 'var(--secondary)', muteFg: 'var(--muted-fg)' },
        { label: 'Drums', level: '20%', muteBorder: 'var(--destructive)', muteBg: 'hsl(0 72% 55% / 0.18)', muteFg: 'var(--destructive)' },
        { label: 'Gtr',   level: '74%', muteBorder: 'var(--border)', muteBg: 'var(--secondary)', muteFg: 'var(--muted-fg)' },
        { label: 'Keys',  level: '55%', muteBorder: 'var(--border)', muteBg: 'var(--secondary)', muteFg: 'var(--muted-fg)' },
        { label: 'Vocal', level: '88%', muteBorder: 'var(--border)', muteBg: 'var(--secondary)', muteFg: 'var(--muted-fg)' },
      ],
    };
  }
}
</script>
</body>
</html>
