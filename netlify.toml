[build]
  command = "npm run check:schema && npm run build && npm run indexnow"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ---------------------------------------------------------------------------
# Webhook setup (one-time manual steps):
#
# 1. Netlify → Site settings → Build & deploy → Build hooks
#    → Add build hook → Name: "Supabase publish" → Copy the URL
#
# 2. Supabase → Dashboard → Database → Webhooks → Create a new hook
#    → Table: public_songs
#    → Events: INSERT, UPDATE
#    → Method: POST
#    → URL: [paste Netlify build hook URL from step 1]
#
# Result: publishing a song triggers a Netlify rebuild (~60s).
# The rebuild regenerates sitemap-index.xml and warms all SSR routes.
# ---------------------------------------------------------------------------

# Security headers — applied globally.
# NOTE: these [[headers]] blocks don't reach SSR functions (song pages, etc.) — Netlify's
# static header rules only apply to prerendered/static responses. SSR routes get their
# headers from SECURITY_HEADERS in src/middleware.ts instead, which must be kept in sync
# with the values below by hand.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co https://cdn.jsdelivr.net https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none';"

# Tuner page needs microphone access — override the global Permissions-Policy
[[headers]]
  for = "/tuner/"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# Edge-cache /songs/ index and individual song pages (SSR — content changes only on new song publish)
# Security headers are restated explicitly here (not just relying on the global /* block
# above) because Netlify's per-path header merging is not guaranteed when multiple
# [[headers]] blocks match the same path — this previously left /songs/* without HSTS.
[[headers]]
  for = "/songs/"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co https://cdn.jsdelivr.net https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none';"

[[headers]]
  for = "/songs/*"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co https://cdn.jsdelivr.net https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none';"

# www → apex redirect (prevents www subdomain from being indexed separately)
[[redirects]]
  from   = "https://www.chordsequence.com/*"
  to     = "https://chordsequence.com/:splat"
  status = 301
  force  = true

# Some SEO tools/crawlers assume /sitemap-index.xml by convention — redirect it to the
# real one. NOTE: this must be status=301, not 200 — a 200 rewrite here 404s in
# production (Astro's SSR handler claims the path first since no
# sitemap-index.xml.ts route exists; there's no such static file to force-override).
[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap-combined.xml"
  status = 301
  force = true

# sitemap.xml → sitemap-combined.xml (canonical sitemap entry point)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-combined.xml"
  status = 301
  force = true

