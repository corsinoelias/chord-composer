# tried first and does not work: the Astro adapter's catch-all SSR function is matched ahead
# of netlify.toml's redirect engine and answers with its own 404 first, with `force = true`
# making no difference (verified 2026-08-11 against the real built output via
# `netlify dev --dir dist`). Do not re-add a rule here expecting it to win — see the long
# comment in that edge function for the full routing order.
