# Redirect /songs/?page=* to /songs/ — no pagination exists, avoids soft-404 indexing (HIGH)
# NOTE: trailing "?" on `to` clears the incoming query string. Without it, Netlify
# re-appends the unmatched query onto the target, causing /songs/?page=2 to redirect
# back to /songs/?page=2 — an infinite loop (this was a live CRITICAL bug).
[[redirects]]
  from = "/songs/"
  to = "/songs/?"
  status = 301
  force = true
  [redirects.query]
    page = ":page"

# Old editor URL → renamed to /chord-player/ (permanent, preserves song IDs in the path)
[[redirects]]
  from = "/editor/*"
  to = "/chord-player/:splat"
  status = 301
  force = true

# NOTE: no explicit SPA-fallback redirect for /chord-player/* here (unlike the old /editor/*
# rule) — src/middleware.ts already does this rewrite at the Astro SSR layer, and testing
# showed the Netlify dev redirect emulation's 200-status rewrites can 404 deep-link paths
# before they ever reach that middleware. The adapter's own catch-all already routes
# unmatched paths to the SSR function in production, so middleware.ts alone is sufficient.
