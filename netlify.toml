# REVERTED 2026-08-02: a "trailing-slash backstop for SSR routes" block used to live here
# (added by c1613f6, one rule each for /songs/pdf/:slug, /songs/new, /admin/songs,
# /bass-tab, /guitar-tab, plus a generic /songs/:slug catch-all further below). Intent was
# to fix a 404 when a link is missing its trailing slash. Instead it caused a live infinite
# 301 loop on the CANONICAL already-slashed URL (e.g. /songs/wonderwall-oasis/ redirecting
# to itself), confirmed in production. Root cause: Netlify's `:param`/literal `from`
# matching strips the trailing slash before comparing, so `from = "/songs/:slug"` matches
# `/songs/foo/` just as much as `/songs/foo`. `force = true` doesn't gate this — per
# @netlify/redirects' own handler, force only decides precedence against an existing
# STATIC file in the publish dir; these are SSR routes (Netlify Functions), not static
# files, so the redirect fires unconditionally either way, self-looping the slashed URL.
# There's no declarative from/to rule that can match "no trailing slash" without also
# matching "has trailing slash" here — fixing the 404-without-slash case properly needs
# either `trailingSlash: 'ignore'` in astro.config.mjs (blast radius: every prerendered
# route site-wide, not just these) or a Netlify Edge Function that inspects the raw path.
# Neither is worth the risk mid-incident, so this reverts to the pre-c1613f6 state:
# a slash-less request 404s (same as before, low severity — no real link omits the slash)
# instead of the canonical URL looping (severe — breaks every song/bass-tab/guitar-tab page
# for every real visitor and every indexed Google link).

