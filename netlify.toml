[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ---------------------------------------------------------------------------
# Webhook setup (one-time manual steps):
#
# 1. Netlify → Site settings → Build & deploy → Build hooks
#    → Add build hook → Name: "Supabase publish" → Copy the URL
#
# 2. Supabase → Dashboard → Database → Webhooks → Create a new hook
#    → Table: public_songs
#    → Events: INSERT, UPDATE
#    → Method: POST
#    → URL: [paste Netlify build hook URL from step 1]
#
# Result: publishing a song triggers a Netlify rebuild (~60s).
# The rebuild regenerates sitemap-index.xml and warms all SSR routes.
# ---------------------------------------------------------------------------

# Security headers — applied globally
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none';"

# Tuner page needs microphone access — override the global Permissions-Policy
[[headers]]
  for = "/tuner/"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

# Edge-cache /songs/ index and individual song pages (SSR — content changes only on new song publish)
[[headers]]
  for = "/songs/"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/songs/*"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

# Serve custom sitemap index (includes both sitemap-0.xml and sitemap-songs.xml)
# force=true overrides the static sitemap-index.xml generated by @astrojs/sitemap
[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap-combined.xml"
  status = 200
  force = true

# sitemap.xml → sitemap-combined.xml (canonical sitemap entry point)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-combined.xml"
  status = 301
  force = true

# /learn/circle-of-fifths/ was renamed to /learn/circle-of-fifths-explained/
[[redirects]]
  from = "/learn/circle-of-fifths/"
  to = "/learn/circle-of-fifths-explained/"
  status = 301
  force = true

[[redirects]]
  from = "/learn/circle-of-fifths"
  to = "/learn/circle-of-fifths-explained/"
  status = 301
  force = true

# CRIT-2: /blog/ → /learn/ (old URL pattern)
[[redirects]]
  from = "/blog"
  to = "/learn/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/learn/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/learn/:splat"
  status = 301
  force = true

# Redirect old community song URLs to clean URLs
[[redirects]]
  from = "/songs/c/:slug"
  to = "/songs/:slug"
  status = 301
  force = true

# Beginner pages moved under /learn/
[[redirects]]
  from = "/beginner-guitar-chords/"
  to = "/learn/beginner-guitar-chords/"
  status = 301
  force = true

[[redirects]]
  from = "/beginner-guitar-chords"
  to = "/learn/beginner-guitar-chords/"
  status = 301
  force = true

[[redirects]]
  from = "/easy-guitar-songs/"
  to = "/learn/easy-guitar-songs/"
  status = 301
  force = true

[[redirects]]
  from = "/easy-guitar-songs"
  to = "/learn/easy-guitar-songs/"
  status = 301
  force = true

# SPA fallback for editor deep links
[[redirects]]
  from = "/editor/*"
  to = "/editor/"
  status = 200
