# /songs/?page=* → /songs/ (no pagination exists, avoids soft-404 indexing) is handled
# in src/middleware.ts, not here. A netlify.toml `to = "/songs/?"` rule was tried twice
# and both times the query string re-appended at Netlify's edge instead of clearing,
# causing an infinite redirect loop. An explicit Response.redirect in middleware.ts
# builds a clean URL with no query string by construction — no edge-config trick to fail.

# Old editor URL → renamed to /chord-player/ (permanent, preserves song IDs in the path)
[[redirects]]
  from = "/editor/*"
  to = "/chord-player/:splat"
  status = 301
  force = true

